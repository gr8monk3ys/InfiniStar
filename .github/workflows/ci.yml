name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Load CI environment
        run: |
          set -a
          source .env.ci.example
          set +a
          # Export all vars so they persist across steps
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            # Trim whitespace
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_ENV"
          done < .env.ci.example

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        # Run Jest (project test baseline). `--runInBand` improves determinism
        # for module-mocking-heavy suites in CI. `--forceExit` avoids hangs
        # from known open-handle leakage in a few suites.
        run: bun run test --runInBand --forceExit
        env:
          CI: true

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infinistar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infinistar_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/infinistar_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Load CI environment
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            # DATABASE_URL/DIRECT_URL come from the service container above.
            [[ "$key" == "DATABASE_URL" || "$key" == "DIRECT_URL" ]] && continue
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_ENV"
          done < .env.ci.example

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately `migrate deploy` and not `db push`: this is the command
      # production runs, so CI proves migration history can build the database
      # from scratch. A missing migration used to make this fail.
      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Run integration tests
        run: bun run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Load CI environment
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_ENV"
          done < .env.ci.example

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: SKIP_ENV_VALIDATION=1 bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: .next
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'

      - name: Load CI environment
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            [ -n "$key" ] && echo "$key=$value" >> "$GITHUB_ENV"
          done < .env.ci.example

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun audit --audit-level=high
        continue-on-error: true

      - name: Check for vulnerabilities
        run: |
          bun audit --json > audit.json || true
          cat audit.json
